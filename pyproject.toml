[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-optimizator"
version = "0.1.0"
description = "MOE Optimizator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MOE Optimizator Team" }]
dependencies = []

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "PySide6>=6.6",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
moe-optimizator = "moe_optimizator.cli:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyinstaller",
    "/scripts",
    "/docs",
    "/Makefile",
    "/CONTRIBUTING.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
