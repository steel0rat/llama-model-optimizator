name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist" "moe-optimizator.exe"
          if (-not (Test-Path $exe)) { throw "Missing: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "OK: $exe ($([math]::Round($size / 1MB, 1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-optimizator-windows
          path: dist/moe-optimizator.exe
          if-no-files-found: error
          retention-days: 90
